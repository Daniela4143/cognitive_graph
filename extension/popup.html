<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 300px;
            padding: 10px;
            font-family: sans-serif;
        }
        textarea {
            width: 100%;
            height: 100px;
        }
        #result {
            margin-top: 10px;
            white-space: pre-wrap;
        }
        #reactionOptions {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <textarea id="inputText" placeholder="Paste text wanted to extract cognitive graph..."></textarea>
    <div id="reactionOptions">
        <label><input type="radio" name="reaction" value="resonate"> Touched &#129401</label>
        <label><input type="radio" name="reaction" value="repel"> Dislike &#128544</label>
        <label><input type="radio" name="reaction" value="curious"> Just for fun &#129321</label>
        <label><input type="radio" name="reaction" value="other"> Other</label>
        <input type="text" id="otherNote" placeholder="Write down your reason if want to be more specific" style="display:none; width: 100%; margin-top: 5px;">
    </div>
    <button id="extractBtn">Extract</button>
    <div id="result"></div>

    <script src="popup.js"></script>
</body>
</html>
